[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinydiff"
version = "0.4.1"
description = "Pedagogical reverse-mode autodiff in 654 lines of NumPy. Trains MLPs without PyTorch."
authors = [{name = "superkush06"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["tinydiff*"]

[tool.pytest.ini_options]
# `tinydiff` is in testpaths so that --doctest-modules picks up the worked
# examples in the docstrings: every `>>>` block in the library is executed
# and its output compared, the same guarantee the README examples get.
testpaths = ["tests", "tinydiff"]
addopts = "-ra -q --doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E702"]
